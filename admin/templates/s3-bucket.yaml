space: ${flows_examples_space_id}

inputs:
  - id: bucket_name
    name: Bucket name
    description: Bucket name should be unique.
    type: short_text
    validations:
      required: true

  - id: region
    name: Region
    description: 'Use the region codes for AWS like "eu-west-1".'
    type: short_text
    validations:
      required: true

stacks:
  - key: s3_bucket
    name: s3-bucket-$${{ inputs.bucket_name }}
    description: >
      Creates the $${{ inputs.bucket_name }} S3 bucket in
      $${{ inputs.region }}.
    labels:
      - template
      - s3
    attachments:
      clouds:
        aws:
          id: ${aws_integration_id}
          read: true
          write: true
    environment:
      variables:
        - name: TF_VAR_bucket_name
          value: $${{ inputs.bucket_name }}
        - name: TF_VAR_region
          value: $${{ inputs.region }}
    vcs:
      reference:
        type: branch
        value: main
      repository: demo
      provider: GITHUB
      project_root: opentofu/flows/aws
    vendor:
      opentofu:
        manage_state: true
        version: "1.13.1"
